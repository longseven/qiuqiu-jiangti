<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>球球大战压轴BOSS · 边听边玩</title>
<style>
  :root{ --ink:#1f2a44; --muted:#475569; --blue:#2563eb; --gold:#c2780c;
         --green:#0f8a3d; --pink:#ec5a86; --red:#e11d48; --bg:#f6f8fc; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0d1020;overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  #wrap{position:absolute;background:var(--bg);overflow:hidden}
  canvas{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%}
  #ui{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
  .panel{position:absolute;left:6%;right:6%;top:18%;background:#fff;border-radius:18px;
    padding:18px;box-shadow:0 12px 40px rgba(15,20,60,.18);pointer-events:auto;
    border:2px solid #e3e9f5}
  .q{font-size:clamp(15px,4.2vmin,21px);font-weight:700;color:var(--ink);margin-bottom:12px;line-height:1.4}
  sup{font-size:.62em;line-height:0}
  .opt{display:block;width:100%;margin:8px 0;padding:11px 14px;font-size:clamp(14px,4vmin,19px);
    font-weight:700;color:var(--blue);background:#eef3ff;border:2px solid #bcd0ff;border-radius:12px;
    text-align:left;cursor:pointer;transition:transform .08s}
  .opt:active{transform:scale(.97)}
  .opt.ok{color:#fff;background:var(--green);border-color:var(--green)}
  .opt.bad{color:#fff;background:var(--red);border-color:var(--red);animation:shake .3s}
  .opt.dim{opacity:.35}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #ring{float:right;width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--blue)}
  .hintbox{margin-top:10px;font-size:clamp(12px,3.4vmin,15px);color:var(--muted);
    background:#f4f7ff;border-radius:10px;padding:9px 12px;display:none;line-height:1.45}
  .tools{display:flex;gap:8px;margin-top:10px}
  .tool{flex:1;padding:8px 6px;font-size:clamp(11px,3.2vmin,14px);font-weight:700;
    color:var(--gold);background:#fff7e8;border:2px solid #f0d9a8;border-radius:10px;cursor:pointer}
  .tool:active{transform:scale(.97)}
  .tool:disabled{opacity:.35;cursor:default}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
  .card{padding:8px 10px;text-align:left;background:#f8fafc;border:2px solid #dbe3f0;
    border-radius:10px;cursor:pointer;line-height:1.3}
  .card b{display:block;font-size:clamp(11px,3.2vmin,13.5px);color:var(--ink)}
  .card b i{font-style:normal;font-size:.8em}
  .card span{font-size:clamp(9px,2.6vmin,11px);color:#64748b}
  .card.on{border-color:var(--green);background:#e9f8ef;box-shadow:0 0 0 1px var(--green)}
  .card:disabled{opacity:.4;cursor:default}
  #vig{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;opacity:0;
    box-shadow:inset 0 0 70px 18px rgba(225,29,72,.75)}
  #actionBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:7%;
    padding:13px 38px;font-size:clamp(16px,4.6vmin,22px);font-weight:800;color:#fff;
    background:linear-gradient(180deg,#ff7a8d,var(--red));border:none;border-radius:999px;
    box-shadow:0 8px 22px rgba(225,29,72,.35);pointer-events:auto;cursor:pointer;display:none}
  #actionBtn:active{transform:translateX(-50%) scale(.95)}
  #banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:900;
    color:var(--blue);text-shadow:0 2px 0 #fff;pointer-events:none;
    font-size:clamp(30px,11vmin,58px);opacity:0;transition:opacity .25s,transform .25s}
  #sub{position:absolute;left:0;right:0;top:47%;text-align:center;font-weight:700;
    color:var(--muted);font-size:clamp(14px,4.4vmin,20px);pointer-events:none;opacity:0;transition:opacity .3s}
  #toast{position:absolute;left:50%;transform:translateX(-50%);bottom:16%;max-width:84%;
    background:rgba(31,42,68,.92);color:#fff;font-size:clamp(13px,3.8vmin,16px);font-weight:600;
    padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;line-height:1.5}
  #tapgo{position:absolute;top:0;left:0;right:0;bottom:0;display:none;align-items:flex-end;justify-content:center;
    padding-bottom:9%;pointer-events:auto;color:var(--muted);
    font-size:clamp(13px,3.8vmin,16px);font-weight:700}
  .pulse{animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.45}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="ui">
    <div id="banner"></div><div id="sub"></div>
    <div id="panel" class="panel" style="display:none"></div>
    <button id="actionBtn"></button>
    <div id="toast"></div>
    <div id="vig"></div>
    <div id="tapgo"><span class="pulse">▶ 点击继续</span></div>
  </div>
</div>

<script>
"use strict";
/* ============ 球球大战压轴BOSS · 边听边玩 ============
   讲解音频 = 关卡脚本:讲到关键句暂停,玩家互动通过才继续。
   与视频共用 storyboard/timeline/TTS(由 export_game.py 解析打包)。 */
// 兼容性:roundRect 在 iOS<16.4 / 旧安卓内核(微信 X5)不存在,白屏元凶
if(window.CanvasRenderingContext2D&&!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.max(0,Math.min(Array.isArray(r)?r[0]:r,w/2,h/2));
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}
// 手机端排障:任何脚本错误直接显示在屏幕上
addEventListener("error",e=>{const t=document.getElementById("toast");
  if(t){t.textContent="出错了: "+e.message;t.style.opacity=1;}});
const D = window.GAME_DATA, M = D.math;
const COL = {BLUE:"#2563eb",GOLD:"#c2780c",GREEN:"#0f8a3d",PINK:"#ec5a86",RED:"#e11d48",
             WHITE:"#1f2a44",MUTED:"#475569",BG:"#f6f8fc",GRID:"#dbe3f0",GP:"#ffffff",GS:"#c4cfe0"};
const cv=document.getElementById("cv"), wrap=document.getElementById("wrap");
const ui={panel:el("panel"),btn:el("actionBtn"),banner:el("banner"),sub:el("sub"),
          toast:el("toast"),tapgo:el("tapgo"),vig:el("vig")};
function el(i){return document.getElementById(i)}
let ctx=cv.getContext("2d"), W=0,H=0,S=1,DPR=Math.min(devicePixelRatio||1,2.5);

function fit(){
  // 隐藏标签页/嵌入环境可能拿到 0 尺寸,用默认竖屏兜底,可见时 resize 会重算
  const vw=innerWidth||390, vh=innerHeight||693, ar=9/16;
  let w=Math.min(vw,vh*ar), h=w/ar;
  wrap.style.width=w+"px";wrap.style.height=h+"px";
  wrap.style.left=(vw-w)/2+"px";wrap.style.top=(vh-h)/2+"px";
  cv.width=w*DPR;cv.height=h*DPR;W=w;H=h;S=w/9;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",fit);
document.addEventListener("visibilitychange",fit);
fit();
const U=(x,y)=>[x*S,H-y*S];               // 逻辑单位(9x16, y朝上)→ 画布像素

/* ---------------- WebAudio SFX(与 pipeline/sfx.py 同配方) ---------------- */
let AC=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function tone(f,dur,type="sine",vol=.5,bend=0,when=0){
  const a=ac(),o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+when;
  o.type=type;o.frequency.setValueAtTime(f,t0);
  if(bend)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*(1+bend)),t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+dur+.05);
}
const SFX={
  ding(p=1){tone(880*p,.5,"sine",.4);tone(1318.5*p,.5,"sine",.25)},  // 连击音调步步高
  coin(){tone(988,.07,"square",.18);tone(1319,.16,"square",.18,0,.07)},
  tick(){tone(1100,.06,"triangle",.3)},
  go(){tone(1660,.25,"triangle",.4)},
  drum(){tone(150,.3,"sine",.6,-.5)},
  boom(){tone(70,.7,"sine",.7,-.3);tone(105,.7,"sine",.4,-.3)},
  buzz(){tone(160,.25,"sawtooth",.3,-.2)},
  pop(){tone(520,.1,"triangle",.3,.6)},
  fanfare(){tone(784,.12,"sine",.4);tone(988,.12,"sine",.4,0,.12);tone(1319,.4,"sine",.45,0,.24)},
};

/* ---------------- 数学(与 graphs/derivative.py 一致) ---------------- */
const A1=Math.exp(-Math.PI);
const f1=x=>Math.exp(x)*Math.cos(3*x)-A1*Math.exp(3*x)*Math.cos(x);
const h2=t=>(2*Math.cos(t)-1)/Math.exp(t);
const g3=x=>3*Math.SQRT2*Math.exp(x)*Math.cos(3*x+Math.PI/4);

/* ---------------- 画布小元件 ---------------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function pill(x,y,txt,bg,size,fg){   // 药丸标签(先画底再画字)
  ctx.font=`800 ${size*S/28}px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif`;
  const w=ctx.measureText(txt).width+0.9*S,[px,py]=U(x,y);
  ctx.fillStyle=bg;rr(px-w/2,py-.48*S,w,.96*S,.48*S);ctx.fill();
  ctx.fillStyle=fg||"#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(txt,px,py);
}
function text(s,x,y,size,color,align="center",weight=800){
  ctx.fillStyle=color;ctx.font=`${weight} ${size*S/28}px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif`;
  ctx.textAlign=align;ctx.textBaseline="middle";const[p,q]=U(x,y);ctx.fillText(s,p,q);
}
function drawMascot(x,y,s,expr,t){       // mascot.py 的 canvas 移植(常用表情)
  const[cx,cy0]=U(x,y), R=s*S, cy=cy0-0.05*R*Math.sin(2*Math.PI*t/1.6);
  const BODY="#4ecdc4",OUT="#2a9d96",EYE="#11324a",CHEEK="#ff9aa2",BULB="#ffcf6e";
  ctx.lineCap="round";
  for(const fx of[-0.4,0.4]){ctx.fillStyle=OUT;ctx.beginPath();
    ctx.ellipse(cx+fx*R,cy+1.02*R,0.17*R,0.10*R,0,0,7);ctx.fill();}
  const up=["cheer","happy","wave","love","angry"].includes(expr);
  ctx.strokeStyle=OUT;ctx.lineWidth=Math.max(3,.09*R);
  for(const sg of[-1,1]){const x0=cx+sg*0.92*R;ctx.beginPath();
    if(expr==="point"&&sg>0){ctx.moveTo(x0,cy+0.05*R);ctx.lineTo(x0+0.72*R,cy-0.06*R)}
    else if(expr==="thumbsup"&&sg>0){ctx.moveTo(x0,cy+0.1*R);ctx.lineTo(x0+0.3*R,cy-0.55*R)}
    else if(up){ctx.moveTo(x0,cy+0.1*R);ctx.lineTo(x0+sg*0.45*R,cy-0.7*R)}
    else{ctx.moveTo(x0,cy+0.1*R);ctx.lineTo(x0+sg*0.3*R,cy+0.5*R)}
    ctx.stroke();}
  if(expr==="thumbsup"){ctx.fillStyle=BODY;ctx.strokeStyle=OUT;ctx.lineWidth=.05*R;
    ctx.beginPath();ctx.ellipse(cx+1.22*R,cy-0.72*R,0.23*R,0.19*R,0,0,7);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.ellipse(cx+1.12*R,cy-0.99*R,0.11*R,0.18*R,.14,0,7);ctx.fill();ctx.stroke();}
  ctx.fillStyle=BODY;ctx.strokeStyle=OUT;ctx.lineWidth=Math.max(2.5,.06*R);
  ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle=CHEEK;ctx.globalAlpha=.75;
  for(const sg of[-1,1]){ctx.beginPath();ctx.arc(cx+sg*0.52*R,cy+0.2*R,0.15*R,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  const ey=cy-0.12*R, ex=0.36*R, blink=(t%2.7)<0.12;
  if(expr==="cool"){ctx.fillStyle=EYE;
    for(const sg of[-1,1]){rr(cx+sg*ex-0.30*R,ey-0.18*R,0.60*R,0.38*R,.1*R);ctx.fill();}
    ctx.strokeStyle=EYE;ctx.lineWidth=.07*R;ctx.beginPath();
    ctx.moveTo(cx-0.06*R,ey-0.04*R);ctx.lineTo(cx+0.06*R,ey-0.04*R);ctx.stroke();}
  else for(const sg of[-1,1]){const gx=cx+sg*ex;
    if(expr==="love"){star(gx,ey,0.30*R,BULB,"#caa23a")}
    else if(expr==="wink"&&sg>0){arc(gx,ey,0.25*R,EYE,.07*R,0.1,0.9)}
    else if(["happy","cheer","thumbsup"].includes(expr)||blink){arc(gx,ey,0.25*R,EYE,.07*R,1.1,1.9)}
    else{ctx.fillStyle="#fff";ctx.strokeStyle=EYE;ctx.lineWidth=.04*R;
      ctx.beginPath();ctx.arc(gx,ey,0.30*R,0,7);ctx.fill();ctx.stroke();
      const lk={think:[-.4,-.5],panic:[0,-.5],point:[.55,0]}[expr]||[0,0];
      ctx.fillStyle=EYE;ctx.beginPath();
      ctx.arc(gx+lk[0]*0.3*R,ey+lk[1]*0.3*R,(expr==="panic"?.10:.15)*R,0,7);ctx.fill();}
    if(expr==="panic"){ctx.strokeStyle=OUT;ctx.lineWidth=.06*R;ctx.beginPath();
      ctx.moveTo(gx-0.22*R,cy-0.62*R);ctx.lineTo(gx+0.16*R,cy-0.72*R);ctx.stroke();}
    if(expr==="angry"){ctx.strokeStyle=OUT;ctx.lineWidth=.07*R;ctx.beginPath();
      ctx.moveTo(gx+sg*0.22*R,cy-0.70*R);ctx.lineTo(gx-sg*0.20*R,cy-0.50*R);ctx.stroke();}}
  const my=cy+0.42*R;
  ctx.strokeStyle=EYE;ctx.lineWidth=Math.max(2.5,.07*R);
  if(["happy","cheer","wave","point","love","wink","cool","thumbsup","idea"].includes(expr)){
    arc(cx,my,0.28*R,EYE,.08*R,0.1,0.9)}
  else if(expr==="panic"||expr==="angry"){ctx.fillStyle=EYE;ctx.beginPath();
    ctx.ellipse(cx,my+0.04*R,0.15*R,0.14*R,0,0,7);ctx.fill()}
  else if(expr==="cry"){arc(cx,my+0.1*R,0.24*R,EYE,.08*R,1.1,1.9)}
  else{ctx.beginPath();ctx.moveTo(cx-0.18*R,my);ctx.lineTo(cx+0.18*R,my);ctx.stroke()}
  if(expr==="panic")drop(cx+1.02*R,cy-0.55*R,0.13*R,"#6cc6ff");
  if(expr==="cry"){drop(cx-0.36*R,cy+0.28*R,.11*R,"#6cc6ff");drop(cx+0.36*R,cy+0.28*R,.11*R,"#6cc6ff")}
  if(expr==="idea"){ctx.fillStyle=BULB;ctx.strokeStyle="#caa23a";ctx.lineWidth=.04*R;
    ctx.beginPath();ctx.arc(cx,cy-1.7*R,0.32*R,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle="#caa23a";ctx.fillRect(cx-0.12*R,cy-1.42*R,0.24*R,0.14*R);}
  function arc(x,y,r,c,w,a0,a1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();
    ctx.arc(x,y,r,Math.PI*a0,Math.PI*a1,false);ctx.stroke();}
  function star(x,y,r,fill,edge){ctx.fillStyle=fill;ctx.strokeStyle=edge;ctx.lineWidth=.03*R;
    ctx.beginPath();for(let k=0;k<10;k++){const an=Math.PI/2+k*Math.PI/5,rad=k%2?r*.42:r;
      ctx[k?"lineTo":"moveTo"](x+rad*Math.cos(an),y-rad*Math.sin(an));}
    ctx.closePath();ctx.fill();ctx.stroke();}
  function drop(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(x-.77*r,y-.15*r);ctx.lineTo(x+.77*r,y-.15*r);ctx.lineTo(x,y-2.1*r);
    ctx.closePath();ctx.fill();}
}
function drawBoss(x,y,s,t,hurt){          // fx.draw_boss 的 canvas 移植
  const[cx,cy0]=U(x,y),R=s*S,cy=cy0-0.06*R*Math.sin(2*Math.PI*t/2.1);
  const BODY="#8b1e3f",SPK="#5b1027",EYE="#ffe9a8";
  for(let k=0;k<11;k++){const an=k/11*2*Math.PI+.28+.04*Math.sin(t*2+k);
    const r0=.92*R,r1=1.32*R,h=.16;ctx.fillStyle=SPK;ctx.beginPath();
    ctx.moveTo(cx+r0*Math.cos(an-h),cy-r0*Math.sin(an-h));
    ctx.lineTo(cx+r0*Math.cos(an+h),cy-r0*Math.sin(an+h));
    ctx.lineTo(cx+r1*Math.cos(an),cy-r1*Math.sin(an));ctx.closePath();ctx.fill();}
  ctx.fillStyle=BODY;ctx.strokeStyle=SPK;ctx.lineWidth=.06*R;
  ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();ctx.stroke();
  for(const sg of[-1,1]){const ex=cx+sg*.36*R,ey=cy-.18*R;
    ctx.fillStyle=EYE;ctx.beginPath();ctx.ellipse(ex,ey,.21*R,.15*R,.31*sg,0,7);ctx.fill();
    ctx.fillStyle="#23030c";ctx.beginPath();ctx.ellipse(ex,ey+.02*R,.05*R,.11*R,0,0,7);ctx.fill();
    ctx.strokeStyle=SPK;ctx.lineWidth=.08*R;ctx.lineCap="round";ctx.beginPath();
    ctx.moveTo(ex+sg*.30*R,ey-.34*R);ctx.lineTo(ex-sg*.26*R,ey-.12*R);ctx.stroke();}
  ctx.strokeStyle="#23030c";ctx.lineWidth=.07*R;ctx.lineJoin="round";ctx.beginPath();
  for(let i=0;i<7;i++){const mx=cx-.31*R+.62*R*i/6,my=cy+.42*R+(i%2?-.10*R:.04*R);
    ctx[i?"lineTo":"moveTo"](mx,my);}ctx.stroke();
  if(hurt>0){ctx.globalAlpha=hurt*.7;ctx.fillStyle="#fff";
    ctx.beginPath();ctx.arc(cx,cy,1.05*R,0,7);ctx.fill();ctx.globalAlpha=1;}
}
function bubbleAt(x,y,txt,color){         // 球球台词泡
  ctx.font=`700 ${.42*S}px "PingFang SC","Hiragino Sans GB",sans-serif`;
  const w=ctx.measureText(txt).width+.7*S,[bx,by]=U(x,y);
  ctx.fillStyle=color;rr(bx-w/2,by-.42*S,w,.84*S,.42*S);ctx.fill();
  ctx.beginPath();ctx.moveTo(bx-.3*S,by+.38*S);ctx.lineTo(bx+.05*S,by+.38*S);
  ctx.lineTo(bx-.45*S,by+.75*S);ctx.closePath();ctx.fill();
  ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(txt,bx,by);
}

/* ---------------- 图象视口 ---------------- */
function graph(vp,xlim,ylim){
  const m={vp,xlim,ylim,
    px(x){return (vp.x+(x-xlim[0])/(xlim[1]-xlim[0])*vp.w)*S},
    py(y){return H-(vp.y+(y-ylim[0])/(ylim[1]-ylim[0])*vp.h)*S},
    panel(){const[a,b]=[this.px(xlim[0]),this.py(ylim[1])];
      ctx.fillStyle=COL.GP;ctx.strokeStyle=COL.GS;ctx.lineWidth=1.5;
      rr(a-8,b-8,vp.w*S+16,vp.h*S+16,10);ctx.fill();ctx.stroke();},
    curve(fn,c,lw=3,upto=1){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.lineJoin="round";ctx.beginPath();
      const n=Math.max(2,Math.floor(220*upto));
      for(let i=0;i<=n;i++){const x=xlim[0]+(xlim[1]-xlim[0])*i/220;
        ctx[i?"lineTo":"moveTo"](this.px(x),this.py(fn(x)));}ctx.stroke();},
    hline(y,c,dash){ctx.strokeStyle=c;ctx.lineWidth=2;ctx.setLineDash(dash||[]);
      ctx.beginPath();ctx.moveTo(this.px(xlim[0]),this.py(y));
      ctx.lineTo(this.px(xlim[1]),this.py(y));ctx.stroke();ctx.setLineDash([]);},
    dot(x,y,c,r=7){ctx.fillStyle=c;ctx.strokeStyle="#fff";ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(this.px(x),this.py(y),r,0,7);ctx.fill();ctx.stroke();}};
  return m;
}

// 各关图象视口(渲染与判定共用,不依赖渲染循环先跑)
function sceneGV(){
  if(!G.scene)return null;
  const vp={x:1.0,y:6.6,w:7.0,h:5.4};
  if(G.scene.id==="part1")return graph(vp,[1.15,1.85],[-5,8]);
  if(G.scene.id==="part2")return graph(vp,[0,Math.PI/2],[-0.55,1.2]);
  if(G.scene.id==="part3")return graph(vp,[0,1.42],[-10.5,6]);
  return null;
}

async function preloadAudio(){
  // 转 Blob URL:不依赖服务器 Range 支持也能 seek(答错重听本句必需)
  await Promise.all(D.scenes.filter(s=>s.audio).map(async s=>{

  }));

/* ---------------- 抽卡解题:知识/方法/建模卡 · 配方出牌 ----------------
   每张卡 = 一个真实解题组件;每一问的求解 = 选出它用到的卡组合(配方)。
   答对互动掉本关 3 张配方卡,第 4 张去商店补(暴击额外随机抽一张);
   关末出牌解题:选对配方 → 连携大伤害;选错按类型给提示;3 次球球演示(评级封顶 A)。 */
const CARDS=[
  {id:"k1",name:"导数几何意义",type:"知识",desc:"切线斜率 = 导数值 f'(切点)"},
  {id:"k2",name:"特殊角三角值",type:"知识",desc:"cos(3π/2)=cos(π/2)=0"},
  {id:"m1",name:"乘积求导",type:"方法",desc:"(uv)'=u'v+uv',别漏项"},
  {id:"m2",name:"点斜式",type:"方法",desc:"过切点、带斜率,直接写方程"},
  {id:"m3",name:"分参流",type:"方法",desc:"把 a 拎到一边:a=h(x)"},
  {id:"b1",name:"换元建模",type:"建模",desc:"t=2x,化繁为简"},
  {id:"m4",name:"单调性定值域",type:"方法",desc:"h'<0 一路下坡"},
  {id:"k3",name:"开区间无端点",type:"知识",desc:"端点取不到,等号安全"},
  {id:"b2",name:"辅助角合体",type:"建模",desc:"2f+f' 合成 3√2 e^x cos(3x+π/4)"},
  {id:"k4",name:"余弦对称性",type:"知识",desc:"纯余弦山谷关于中线对称"},
  {id:"m5",name:"反证法",type:"方法",desc:"假设反面,推出矛盾"},
  {id:"b3",name:"拆分相加",type:"建模",desc:"两条小不等式之和碾过目标"},
];
const CARD=id=>CARDS.find(c=>c.id===id);
const TYPECOL={"知识":"BLUE","方法":"GOLD","建模":"PINK"};
const RECIPE={part1:["k1","k2","m1","m2"],part2:["m3","b1","m4","k3"],part3:["b2","k4","m5","b3"]};
const DROPS={part1:["k2","m1","m2"],part2:["m4","k3","m3"],part3:["b2","k4","b3"]};
function dropCard(c,extra){
  if(!c||G.deck[c.id])return;
  G.deck[c.id]=1;
  spawnDmg(4.5,extra?7.5:8.6,`${extra?"额外抽到":"获得"}【${c.name}】${c.type}卡`,
           COL[TYPECOL[c.type]],15);
}
function rollShop(){                           // 本问缺的配方卡权重 x3
  const un=CARDS.filter(c=>!G.deck[c.id]);
  const need=(RECIPE[G.lastPart]||[]).filter(id=>!G.deck[id]).map(CARD);
  const pool=[...un,...need,...need];
  G.shop=[0,0,0].map(()=>pool.length?pool[Math.random()*pool.length|0]:null);
}
function openShop(){
  const interest=Math.min(5,G.coins/10|0);     // 利息:每 10 金币 +1,上限 5
  if(interest){G.coins+=interest;toast(`存款利息 +${interest} 金币!`,2200);}
  G.solveFails=0;G.battle={stage:"shop"};rollShop();renderShop();
}
function renderShop(){
  const own=Object.keys(G.deck).length;
  ui.panel.innerHTML=
    `<div class="q">备战商店<span style="float:right;color:#c2780c">🪙${G.coins}</span></div>`+
    `<div style="font-size:13px;font-weight:700;margin-bottom:8px;color:#64748b">`+
    `集卡 ${own}/${CARDS.length} · 解题缺卡这里补</div>`+
    G.shop.map((c,i)=>{
      if(!c||G.deck[c.id])return `<button class="opt dim" disabled>${c?esc(c.name)+" · 已拥有":"已售罄"}</button>`;
      return `<button class="opt" data-i="${i}" ${G.coins<3?"disabled":""}>${esc(c.name)} `+
        `<small style="color:#64748b;font-size:.75em">${c.type}卡 · ${fmt(c.desc)}</small>`+
        `<span style="float:right;color:#c2780c">🪙3</span></button>`}).join("")+
    `<div class="tools"><button class="tool" id="reroll" ${G.coins<2?"disabled":""}>🪙2 刷新</button>`+
    `<button class="tool" id="solve" style="color:#fff;background:#e11d48;border-color:#e11d48">去解题!</button></div>`;
  ui.panel.style.display="block";
  ui.panel.querySelectorAll(".opt[data-i]").forEach(b=>b.onclick=()=>{
    const c=G.shop[+b.dataset.i];if(!c||G.coins<3)return;
    G.coins-=3;SFX.coin();dropCard(c);renderShop();});
  ui.panel.querySelector("#reroll").onclick=()=>{
    if(G.coins<2)return;G.coins-=2;SFX.pop();rollShop();renderShop();};
  ui.panel.querySelector("#solve").onclick=renderSolve;

function renderSolve(){
  const sel=(G.battle&&G.battle.sel)||{};
  G.battle={stage:"solve",sel};
  ui.panel.innerHTML=
    `<div class="q">解第${G.scene.idx||""}问,用到哪几张卡?</div>`+
    `<div class="grid">`+CARDS.map(c=>{
      const ownd=G.deck[c.id],on=sel[c.id];
      return `<button class="card${on?" on":""}" data-id="${c.id}" ${ownd?"":"disabled"}>`+
        `<b>${esc(c.name)}<i style="color:${ {BLUE:"#2563eb",GOLD:"#c2780c",PINK:"#ec5a86"}[TYPECOL[c.type]] }"> ${c.type}</i></b>`+
        `<span>${ownd?fmt(c.desc):"未获得 · 商店可补"}</span></button>`}).join("")+`</div>`+
    `<div class="tools"><button class="tool" id="back">← 返回商店</button>`+
    `<button class="tool" id="play" style="color:#fff;background:#0f8a3d;border-color:#0f8a3d">出牌解题!</button></div>`;
  ui.panel.style.display="block";
  ui.panel.querySelectorAll(".card[data-id]").forEach(b=>b.onclick=()=>{
    if(b.disabled)return;sel[b.dataset.id]=!sel[b.dataset.id];
    b.classList.toggle("on",!!sel[b.dataset.id]);SFX.tick();});
  ui.panel.querySelector("#back").onclick=()=>{G.battle={stage:"shop"};renderShop();};
  ui.panel.querySelector("#play").onclick=submitSolve;

function submitSolve(){
  const sel=Object.keys(G.battle.sel).filter(k=>G.battle.sel[k]);
  const need=RECIPE[G.lastPart]||[];
  const missing=need.filter(id=>!sel.includes(id)),extra=sel.filter(id=>!need.includes(id));
  if(!missing.length&&!extra.length){strike(G.solveFails===0);return}
  G.solveFails++;G.retries++;
  if(G.lastPart)G.retriesBy[G.lastPart]=(G.retriesBy[G.lastPart]||0)+1;
  SFX.buzz();G.rage=1;G.shake=.4;
  if(G.solveFails>=3){demonstrate();return}
  const tip=missing.length
    ?`还缺 ${missing.length} 张:${missing.map(id=>CARD(id).type+"卡").join("、")}`
     +(missing.some(id=>!G.deck[id])?"(缺的卡商店有售)":"")
    :`混进了不属于这问的卡:${extra.map(id=>CARD(id).name).join("、")}`;
  toast((missing.length?"差一点!":"多了!")+tip,3400);
}
function demonstrate(){                         // 球球演示正确配方,保通关
  G.assist=true;
  const need=RECIPE[G.lastPart]||[];
  ui.panel.querySelectorAll(".card[data-id]").forEach(b=>{
    b.onclick=null;
    b.classList.toggle("on",need.includes(b.dataset.id));});
  toast("球球演示:这问的配方是【"+need.map(id=>CARD(id).name).join("·")+"】",3600);
  SFX.go();setTimeout(()=>strike(false),2200);
}
function strike(perfect){
  ui.panel.style.display="none";
  G.battle={stage:"strike",t0:now(),perfect,hit:false};

}
function finishSolve(){
  G.battle={stage:"done",doneAt:now()};

}

/* ---------------- 互动调度 ---------------- */
function checkInteractions(){
  if(!G.scene||!G.audio)return;
  if(G.inter){       // 答错重听:补完上一句讲解后回到互动点再暂停
    if(!G.audio.paused&&G.audio.currentTime>=G.inter.at)G.audio.pause();
    return;
  }
  const list=G.scene.interactions;
  if(G.interIdx<list.length&&G.audio.currentTime>=list[G.interIdx].at){
    G.inter=list[G.interIdx];G.fails=0;G.audio.pause();startInteraction(G.inter);
  }
}
function passInteraction(msg,crit){
  const it=G.inter;G.doneInters++;G.combo++;G.coins+=10*Math.min(G.combo,3);
  const dmg=Math.round((100+30*(G.combo-1))*(crit?2:1));
  damageBoss(crit?.06:.04,(crit?"暴击 -":"-")+dmg+"!",crit?COL.GOLD:COL.RED);
  const card=CARD((DROPS[G.scene.id]||[])[G.interIdx]);
  if(card)dropCard(card);                      // 答对掉本问配方卡
  if(crit){const pool=CARDS.filter(c=>!G.deck[c.id]);   // 暴击额外随机抽一张
    if(pool.length)dropCard(pool[Math.random()*pool.length|0],true);}
  G.shake=crit?1:.55;SFX.ding(1+0.06*Math.min(G.combo,6));
  toast(msg||["漂亮!","正解!","就是这个!"][Math.min(G.combo-1,2)]+(G.combo>1?` 连击 x${G.combo}!`:""));
  if(G.combo>=3)spawnDmg(4.5,9.6,`COMBO x${G.combo}!`,COL.PINK,26);
  ui.panel.style.display="none";ui.btn.style.display="none";G.drag=null;
  G.inter=null;G.interIdx++;

function failInteraction(hint){

  G.rage=1;G.shake=.5;                                  // BOSS 反击演出
  if(G.fails>=3){toast("没关系,看球球演示 → "+(hint||""),3200);autoSolve();return;}
  toast((G.fails===1?"再想想:":"提示:")+(hint||"再试一次!"),3000);
  if(G.audio&&G.inter){                                 // 回跳上一句重听讲解
    G.audio.currentTime=Math.max(0,G.inter.replay_from??G.inter.sent_start);
    G.audio.play();

function startInteraction(it){

    peek.onclick=()=>{

      G.coins-=10;SFX.pop();peek.disabled=true;
      ui.panel.querySelector("#hb").style.display="block";};
    ui.panel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      if(i===it.answer){clearInterval(it._timer);b.classList.add("ok");
        ui.panel.querySelectorAll(".opt").forEach((x,j)=>{if(j!==i)x.classList.add("dim")});
        const fast=left>=8&&G.fails===0;               // 极速首答 → 暴击
        if(fast)G.coins+=20;
        setTimeout(()=>passInteraction(fast?"⚡ 极速作答!暴击伤害,金币 +20!":undefined,fast),700);}
      else{b.classList.add("bad");ui.panel.querySelector("#hb").style.display="block";
        failInteraction(it.hint);setTimeout(()=>b.classList.remove("bad"),500);}});
  }
  else if(it.type==="tangent_shot"){
    toast("拖动旋转准星,把切线贴上曲线,然后发射!",3500);
    ui.btn.textContent="🎯 发射切线";ui.btn.style.display="block";
    ui.btn.onclick=()=>{const d=angDiff(G.aim.angle,trueAngle());
      if(d<=6*Math.PI/180){const perfect=d<=2.5*Math.PI/180;
        passInteraction(perfect?"完美贴合!神枪手暴击!":"命中!切线拿下!",perfect)}
      else failInteraction(it.hint);};
    G.drag="aim";
  }
  else if(it.type==="range_lock"){
    toast("上下拖动横线 y=a,拖出曲线值域再锁定!",3500);
    ui.btn.textContent="🔒 锁定安全区";ui.btn.style.display="block";
    ui.btn.onclick=()=>{const eps=.02;
      if(G.aVal>=M.h_top-eps||G.aVal<=M.h_bot+eps){
        const edge=Math.abs(G.aVal-M.h_top)<.06||Math.abs(G.aVal-M.h_bot)<.06;
        if(Math.abs(G.aVal-M.h_top)<.06)G.aVal=M.h_top;
        if(Math.abs(G.aVal-M.h_bot)<.06)G.aVal=M.h_bot;
        passInteraction(edge?"贴边锁定!一寸不让,暴击!":"安全!这个 a 取不到零点!",edge)}
      else failInteraction(it.hint);};
    G.drag="range";
  }
  else if(it.type==="valley_drag"){
    toast("① 把 x₃ 拖到与 x₁ 等高 ② 把 x₂ 拖到谷内切线平行处",4200);
    G.v3.x3=M.p3.x3+0.10;G.v3.x2=M.p3.x2-0.14;G.drag="valley";
  }
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
// ^(..) / ^x -> 真上标(设计稿约定的 ^ 记号,DOM 层用 <sup> 排版)
function fmt(s){return esc(s).replace(/\^\(([^()]+)\)/g,"<sup>$1</sup>")
  .replace(/\^([0-9a-zA-Zπ]+)/g,"<sup>$1</sup>")}
function angDiff(a,b){let d=Math.abs(a-b)%Math.PI;return Math.min(d,Math.PI-d)}

/* 画布公式排版:^(..)/^x 上标缩小抬高,₀-₉ 下标缩小下沉(不依赖字体下标字形) */
function mseg(s){
  const out=[];let i=0,plain="";
  const push=()=>{if(plain){out.push({k:0,s:plain});plain=""}};
  while(i<s.length){
    if(s[i]==="^"){
      const m=/^\^\(([^()]+)\)/.exec(s.slice(i))||/^\^([0-9a-zA-Zπ]+)/.exec(s.slice(i));
      if(m){push();out.push({k:1,s:m[1]});i+=m[0].length;continue}
    }
    const sub="₀₁₂₃₄₅₆₇₈₉".indexOf(s[i]);
    if(sub>=0){push();out.push({k:-1,s:""+sub});i++;continue}
    plain+=s[i];i++;
  }
  push();return out;
}
function mtext(s,x,y,size,color,align="center",weight=800){
  const segs=mseg(String(s)),base=size*S/28;
  const f=sz=>`${weight} ${sz*S/28}px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif`;
  let wsum=0;
  for(const g of segs){ctx.font=f(g.k?size*.62:size);g.w=ctx.measureText(g.s).width;wsum+=g.w}
  let[px,py]=U(x,y);
  px-=align==="center"?wsum/2:align==="right"?wsum:0;
  ctx.fillStyle=color;ctx.textAlign="left";ctx.textBaseline="middle";
  for(const g of segs){ctx.font=f(g.k?size*.62:size);
    ctx.fillText(g.s,px,py+(g.k>0?-.34:g.k<0?.22:0)*base);px+=g.w}
}

/* ---------------- 指针交互 ---------------- */
let pointer={down:false,x:0,y:0};
function evPos(e){const r=wrap.getBoundingClientRect();
  const p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}
function onDown(e){const p=evPos(e);pointer={down:true,...p};
  if(G.phase==="title"){startGame();return}
  if(ui.tapgo.style.display!=="none"&&G.phase!=="title"){nextScene();return}
  // 收金币 / 宝石
  for(const c of G.coinsFly){const[cx,cy]=U(c.x,c.y);
    if(!c.got&&Math.hypot(cx-p.x,cy-p.y)<32){c.got=true;
      const v=c.gem?15:5;G.coins+=v;SFX.coin();
      spawnDmg(c.x,c.y,"+"+v,c.gem?"#a855f7":COL.GOLD,14);return}}
  // 戳球球
  const mp=mascotPos();if(mp){const[mx,my]=U(mp[0],mp[1]);
    if(Math.hypot(mx-p.x,my-p.y)<mp[2]*S*1.2){
      G.mascotExpr=["wink","love","cool","idea","cheer"][Math.random()*5|0];
      G.mascotTapT=now();SFX.pop();
      if(Math.random()<.3)toast(["球球:别慌,机关我都教你了!","球球:连击别断,金币翻倍!",
        "球球:金币攒着,卡题时能买提示!","球球:这题我闭着眼都会(骄傲)"][Math.random()*4|0],2000);}}
  dragMove(p);
}
function dragMove(p){
  if(!pointer.down||!G.drag)return;
  if(!GV)GV=sceneGV();
  if(G.drag==="aim"&&GV){const px=GV.px(Math.PI/2),py=GV.py(0);
    G.aim.angle=Math.atan2(-(p.y-py),p.x-px);}
  else if(G.drag==="range"&&GV){
    const y=(H-p.y)/S, vp=GV.vp;
    let a=GV.ylim[0]+(y-vp.y)/vp.h*(GV.ylim[1]-GV.ylim[0]);
    G.aVal=Math.max(GV.ylim[0]+.02,Math.min(GV.ylim[1]-.02,a));}
  else if(G.drag==="valley"&&GV){
    const x=GV.xlim[0]+((p.x/S)-GV.vp.x)/GV.vp.w*(GV.xlim[1]-GV.xlim[0]);
    const v=G.v3;
    if(!v.x3done&&Math.abs(x-(v.x3??M.p3.x3))<Math.abs(x-(v.x2??M.p3.x2))||v.x2done){
      v.x3=Math.max(M.p3.x2+.05,Math.min(1.38,x));
      if(Math.abs(g3(v.x3)-M.p3.L)<.45&&v.x3>M.p3.x2+.2){v.x3=M.p3.x3;if(!v.x3done){v.x3done=true;SFX.coin();
        toast("x₃ 就位!和 x₁ 等高 → x₁+x₃ > π/2",2600);}}
    }else{
      v.x2=Math.max(M.p3.x1+.04,Math.min(M.p3.x3-.05,x));
      if(Math.abs(v.x2-M.p3.x2)<.05){v.x2=M.p3.x2;if(!v.x2done){v.x2done=true;SFX.coin();
        toast("x₂ 就位!g'(x₂)=L → x₂ > π/4",2600);}}
    }
    if(v.x3done&&v.x2done){G.drag=null;setTimeout(()=>passInteraction("三球之和冲破 3π/4,BOSS 暴击!",true),800);}
  }
}

/* ---------------- HUD(图标自绘,不依赖 emoji 字体)---------------- */
function coinIcon(px,py,r){ctx.fillStyle=COL.GOLD;ctx.strokeStyle="#8a5a08";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(px,py,r,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle="#fff8";ctx.font=`700 ${r*1.3}px sans-serif`;
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("¥",px,py+1);}
function flameIcon(px,py,r){ctx.fillStyle="#ff7a3c";ctx.beginPath();
  ctx.moveTo(px,py-1.5*r);
  ctx.quadraticCurveTo(px+1.2*r,py-0.3*r,px+0.75*r,py+0.55*r);
  ctx.quadraticCurveTo(px+0.45*r,py+1.05*r,px,py+1.05*r);
  ctx.quadraticCurveTo(px-0.45*r,py+1.05*r,px-0.75*r,py+0.55*r);
  ctx.quadraticCurveTo(px-1.2*r,py-0.3*r,px,py-1.5*r);ctx.fill();
  ctx.fillStyle="#ffd166";ctx.beginPath();ctx.arc(px,py+0.45*r,0.42*r,0,7);ctx.fill();}
function speakerIcon(px,py,r){ctx.fillStyle=COL.MUTED;ctx.beginPath();
  ctx.moveTo(px-r,py-0.5*r);ctx.lineTo(px-0.3*r,py-0.5*r);ctx.lineTo(px+0.4*r,py-1.1*r);
  ctx.lineTo(px+0.4*r,py+1.1*r);ctx.lineTo(px-0.3*r,py+0.5*r);ctx.lineTo(px-r,py+0.5*r);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=COL.MUTED;ctx.lineWidth=Math.max(1.5,r*.22);ctx.beginPath();
  ctx.arc(px+0.55*r,py,0.85*r,-Math.PI/3,Math.PI/3);ctx.stroke();}
const HUDFONT=sz=>`800 ${sz*S/28}px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif`;

let GV=null;
function draw(){
  requestAnimationFrame(draw);
  const t=now();G.lt=(performance.now()-G.t0)/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);ctx.fillStyle=COL.BG;ctx.fillRect(0,0,W,H);
  if(G.shake>0){ctx.translate((Math.random()-.5)*12*G.shake,(Math.random()-.5)*12*G.shake);

  G.rage=Math.max(0,G.rage-.035);ui.vig.style.opacity=G.rage.toFixed(2);
  G.bossHurt=Math.max(0,G.bossHurt-.04);
  const ph=G.phase;
  if(ph==="title")drawTitle(t);
  else if(ph==="hook")drawHook(t);
  else if(ph==="card")drawCard(t);
  else if(ph==="part")drawPart(t);
  else if(ph==="clear")drawClear(t);
  else if(ph==="summary"||ph==="end")drawSummary(t);
  // 闲手金币
  if(ph==="part"&&!G.inter&&t-lastCoin>4){lastCoin=t;if(Math.random()<.8)spawnCoin(t)}
  G.coinsFly=G.coinsFly.filter(c=>!c.got&&t-c.born<4.5);
  for(const c of G.coinsFly){c.y+=0.016*c.vy;
    const[px,py]=U(c.x,c.y);
    if(c.gem){const r=13+2*Math.sin(t*6+c.x);          // 菱形宝石
      ctx.fillStyle="#a855f7";ctx.strokeStyle="#6b21a8";ctx.lineWidth=2;
      ctx.save();ctx.translate(px,py);ctx.rotate(t*2);
      ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r*.7,0);ctx.lineTo(0,r);ctx.lineTo(-r*.7,0);
      ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
    else{ctx.fillStyle=COL.GOLD;ctx.strokeStyle="#8a5a08";ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(px,py,12+2*Math.sin(t*6+c.x),0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle="#fff8";ctx.font="700 12px sans-serif";ctx.textAlign="center";ctx.fillText("¥",px,py+1);}}
  // 伤害飘字
  G.dmgs=G.dmgs.filter(d=>t-d.born<1.3);
  for(const d of G.dmgs){const tt=t-d.born;
    ctx.globalAlpha=Math.max(0,1-tt/1.3);

    ctx.globalAlpha=1;}
  G.confetti=G.confetti.filter(c=>t-c.born<2.6);
  for(const c of G.confetti){const tt=t-c.born;
    const[px,py]=U(c.x+c.vx*tt,c.y+c.vy*tt-4.6*tt*tt);
    ctx.globalAlpha=Math.max(0,1.2-tt/2);ctx.fillStyle=c.c;ctx.fillRect(px-5,py-5,10,10);ctx.globalAlpha=1;}
  drawHUD();
  checkInteractions();
  // 台词泡
  if(G.audio&&G.scene&&!G.inter){
    const ct=G.audio.currentTime;

    if(b){const mp=mascotPos()||[4.5,4];bubbleAt(mp[0]+2.0,mp[1]+1.3,b.text,COL[b.color]||COL.BLUE);}
  }
}

function drawCard(t){
  const c=partColor();
  text("关 "+(G.scene.idx||""),4.5,10.6,64,c);
  text(G.scene.title||"",4.5,8.9,38,COL.WHITE);
  if(G.lt>0.6)text("READY?",4.5,7.2,26,c);
  drawMascot(4.5,4.2,1.1,"cheer",t);
}
function drawPart(t){
  const sc=G.scene,c=partColor();
  pill(4.5,14.3,`关${sc.idx} · ${sc.title}`,c,20);
  // 图象
  GV=sceneGV();
  if(sc.id==="part1"){
    GV.panel();GV.curve(f1,COL.BLUE,3,Math.min(1,G.lt/1.6));
    GV.dot(Math.PI/2,0,COL.PINK,8);
    text("切点 (π/2, 0)",6.9,7.1,13,COL.PINK);
    // 准星线
    const it=G.inter, firing=it&&it.type==="tangent_shot";
    if(firing||G.interIdx>1){
      const ang=firing?G.aim.angle:trueAngle();
      const px=GV.px(Math.PI/2),py=GV.py(0),L=4.2*S;
      ctx.strokeStyle=firing?COL.RED:COL.GOLD;ctx.lineWidth=3;
      ctx.setLineDash(firing?[10,7]:[]);ctx.beginPath();
      ctx.moveTo(px-L*Math.cos(ang),py+L*Math.sin(ang));
      ctx.lineTo(px+L*Math.cos(ang),py-L*Math.sin(ang));ctx.stroke();ctx.setLineDash([]);
      if(firing){const d=angDiff(ang,trueAngle());
        text(d<=6*Math.PI/180?"就是现在!发射!":"还没贴合…继续拧",4.5,5.6,15,
             d<=6*Math.PI/180?COL.GREEN:COL.MUTED);}}
  }
  else if(sc.id==="part2"){
    GV.panel();GV.curve(h2,COL.GOLD,3,Math.min(1,G.lt/1.6));
    const locking=G.inter&&G.inter.type==="range_lock";
    if(locking||G.interIdx>1){
      const a=G.aVal;GV.hline(a,COL.RED,[8,6]);
      text("y = a",1.7,GVy(a)+0.35,13,COL.RED);
      GV.hline(M.h_top,COL.GREEN,[3,5]);GV.hline(M.h_bot,COL.GREEN,[3,5]);
      if(a<M.h_top&&a>M.h_bot){           // 有零点 → 刷怪
        const tt=hSolve(a);GV.dot(tt,a,COL.RED,9+2*Math.sin(t*8));
        text("零点怪出现!",4.5,5.6,15,COL.RED);}
      else text("安全!没有交点",4.5,5.6,15,COL.GREEN);}
    function GVy(y){return (H-GV.py(y))/S}
  }
  else if(sc.id==="part3"){
    GV.panel();GV.curve(g3,COL.GREEN,3,Math.min(1,G.lt/1.6));GV.hline(0,COL.GS);
    const v=G.v3, dragging=G.inter&&G.inter.type==="valley_drag";
    if(dragging||G.interIdx>1){
      GV.hline(M.p3.L,COL.PINK,[8,6]);
      GV.dot(M.p3.x1,g3(M.p3.x1),COL.RED,8);mtext("x₁",gx(M.p3.x1),gy(g3(M.p3.x1))-0.55,14,COL.RED);
      const x3=v.x3done?M.p3.x3:(v.x3??M.p3.x3+0.1);
      GV.dot(x3,g3(x3),v.x3done?COL.GREEN:COL.RED,9);
      mtext("x₃",gx(x3),gy(g3(x3))-0.55,14,v.x3done?COL.GREEN:COL.RED);
      const x2=v.x2done?M.p3.x2:(v.x2??M.p3.x2-0.14);
      GV.dot(x2,g3(x2),v.x2done?COL.GREEN:COL.GOLD,9);
      mtext("x₂",gx(x2),gy(g3(x2))-0.55,14,COL.GOLD);
      // 能量条
      const sum=M.p3.x1+x2+x3, p=Math.min(1,sum/M.target3);
      const[ex,ey]=U(1.2,5.5);ctx.fillStyle="#eef2f8";rr(ex,ey,6.6*S,.5*S,.25*S);ctx.fill();
      ctx.fillStyle=p>=1?COL.GREEN:COL.GOLD;rr(ex+3,ey+3,(6.6*S-6)*p,.5*S-6,.2*S);ctx.fill();
      mtext(`x₁+x₂+x₃ ${p>=1?"> 3π/4,突破!":"充能中…"}`,4.5,5.0,14,p>=1?COL.GREEN:COL.MUTED);}
    function gx(x){return GV.vp.x+(x-GV.xlim[0])/(GV.xlim[1]-GV.xlim[0])*GV.vp.w}
    function gy(y){return GV.vp.y+(y-GV.ylim[0])/(GV.ylim[1]-GV.ylim[0])*GV.vp.h}
  }
  // BOSS 答错时扑向屏幕反击,答对时受击闪白
  drawBoss(7.6-1.1*G.rage,13.1-0.4*G.rage,0.55*(1+0.45*G.rage),t,G.bossHurt);
  drawMascot(1.5,5.0,0.7,G.tappedExpr(t,G.inter?"think":"point"),t);
}
function hSolve(a){let lo=1e-4,hi=Math.PI/2-1e-4;   // h 单调减,二分求交点
  for(let i=0;i<40;i++){const mid=(lo+hi)/2;(h2(mid)>a)?lo=mid:hi=mid;}return(lo+hi)/2}
function partStars(id){const r=G.retriesBy[id]||0;return r===0?3:r<=2?2:1}
function drawClear(t){
  const c=partColor(),b=G.battle;
  if(b&&(b.stage==="shop"||b.stage==="solve")){ // 备战/出牌:面板是 DOM,画布留头尾
    text(b.stage==="shop"?"备战阶段 · 缺卡先补齐":"出牌解题 · 选出本问的配方",
         4.5,14.6,16,COL.MUTED);
    drawMascot(1.6,4.3,0.7,G.tappedExpr(t,"idea"),t);
    drawBoss(7.2,4.2,0.6,t,0);text("BOSS 等你",7.2,2.9,12,COL.MUTED);
    return;
  }
  if(b&&b.stage==="strike"){                   // 配方命中:连携一击
    drawBoss(4.5,11.6,0.95,t,G.bossHurt);
    if(!b.hit&&t-b.t0>0.45){b.hit=true;
      const dmg=b.perfect?0.30:0.22;
      G.hp=Math.max(G.scene.final?0:0.01,G.hp-dmg);
      if(G.scene.final)G.hp=0;
      G.bossHurt=1;G.shake=1;SFX.boom();
      spawnDmg(4.5,12.9,(b.perfect?"完美配方!四卡连携 -":G.assist?"球球代打 -":"配方成立 -")
               +Math.round(dmg*100)+"%!",b.perfect?COL.GOLD:COL.PINK,15);}
    text(b.perfect?"一次到位,直接斩!":"配方打出!",4.5,14.6,18,COL.RED);
    drawMascot(1.6,4.3,0.7,"cheer",t);
    if(t-b.t0>1.9)finishSolve();
    return;
  }
  text(G.scene.final?(G.assist?"险胜!BOSS 击败!":"BOSS 击败!"):`关${G.scene.idx} 通关!`,
       4.5,10.8,G.scene.final&&G.assist?34:46,G.scene.final?COL.RED:c);
  if(G.lastPart){const ps=partStars(G.lastPart);
    text("★".repeat(ps)+"☆".repeat(3-ps),4.5,9.4,34,COL.GOLD);
    if(ps===3)text("零失误!",4.5,8.4,15,COL.GREEN);}
  if(G.scene.xp)text(`+${G.scene.xp} XP`,4.5,7.4,26,COL.GOLD);
  if(G.scene.combo)text(G.scene.combo,4.5,6.3,18,COL.PINK);
  drawMascot(4.5,3.9,1.1,"thumbsup",t);
}
function drawSummary(t){
  const parts=D.scenes.filter(s=>s.template==="part");
  const star=parts.map(p=>partStars(p.id)),tot=star.reduce((a,b)=>a+b,0),mx=parts.length*3||1;
  let rank=tot>=mx?"S":tot>=mx-2?"A":tot>=mx-4?"B":"C";
  if(G.assist&&rank==="S")rank="A";            // 靠球球补刀的局拿不到 S
  text("三关 · 全通关!",4.5,14.2,28,COL.GOLD);
  text(rank,4.5,12.4,62,rank==="S"?COL.GOLD:rank==="A"?COL.GREEN:COL.BLUE);
  text({S:"满分剑客 · 一刀斩BOSS",A:"压轴猎人 · 稳!",B:"闯关勇士 · 再磨一刀",
        C:"套路已会 · 再战必赢"}[rank],4.5,10.9,17,COL.PINK);
  text(parts.map((p,i)=>`关${i+1} `+"★".repeat(star[i])+"☆".repeat(3-star[i])).join("  "),
       4.5,9.9,13,COL.GOLD);
  text(`金币 ${G.coins} · 重试 ${G.retries} · 集卡 ${Object.keys(G.deck).length}/${CARDS.length}`,4.5,9.0,14,COL.MUTED);
  if(!G._rec){G._rec=" ";try{                          // 最佳纪录只算一次
    const k="qq_best_"+(D.meta.title||"game"),old=JSON.parse(localStorage.getItem(k)||"null");
    if(!old||tot>old.tot||(tot===old.tot&&G.coins>old.coins)){
      localStorage.setItem(k,JSON.stringify({tot,coins:G.coins}));
      G._rec=old?"★ 新纪录!":" ";}
    else G._rec=`历史最佳:${old.tot}★ · ${old.coins}金币`;
  }catch(e){}}
  if(G._rec.trim())text(G._rec,4.5,8.1,14,G._rec.includes("新纪录")?COL.RED:COL.MUTED);
  const rows=G.scene&&G.scene.rows||[];
  rows.forEach((r,i)=>mtext(`${r.idx}  ${r.plain||stripTex(r.tex)}`,4.5,7.1-i*0.85,13,COL[r.accent]||COL.WHITE));
  text("你卡在第几关?评论区晒出你的评级!",4.5,4.3,16,COL.PINK);
  drawMascot(4.5,2.9,0.9,"cheer",t);
  ui.tapgo.style.display="flex";ui.tapgo.firstElementChild.textContent="↻ 再战一局";
  ui.tapgo.onclick=()=>location.reload();
}
function stripTex(s){return String(s||"").replace(/\\(mathrm|frac|left|right|in|cup|infty|pi)/g,"")
  .replace(/[${}\\]/g,"").replace(/\s+/g," ")}
draw();
// 逻辑心跳与渲染解耦:标签页后台时 rAF 被节流,互动调度与场景推进不能停
setInterval(()=>{
  const lt=(performance.now()-G.t0)/1000;
  if(G.phase==="card"&&lt>1.9)nextScene();
  else if(G.phase==="clear"&&G.battle&&G.battle.stage==="done"&&now()-G.battle.doneAt>2.6)nextScene();
  else checkInteractions();
},200);
</script>
